    description: 对输入 5UTR 序列评分
    input_schema:
      type: object
      properties:
        sequence:
          type: string
      required:
      - sequence
      additionalProperties: false
    output_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    draft_reason: 输出合同尚未按真实 adapter 结果递归闭合；完成确定性完整路径验证后再暴露
