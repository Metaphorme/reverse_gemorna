      additionalProperties: false
    description_en: Generate a 3UTR at a length preset and score it with the 3UTR predictor.
    doc:
      parameters_en:
        "/properties/seed": "Optional random seed; generated results may vary when it is omitted."
    availability:
      requires: []
      role: local
  score_5utr:
    exposure: exposed
    lifecycle:
      kind: local
    resources:
      memory_bytes: 17179869184
      default_wall_time_seconds: 600
      max_wall_time_seconds: 7200
      default_storage_bytes: 67108864
      max_output_bytes: 8388608
      cpu_count: 2
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    description: 对输入 5UTR 序列评分
    input_schema:
      type: object
      properties:
        sequence:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: ^[ACGUTNacgutn]+$
      required:
      - sequence
      additionalProperties: false
    output_schema:
      type: object
      properties:
        utr_type:
          type: string
          const: 5utr
        sequence:
