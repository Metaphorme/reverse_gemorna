        score:
          type: number
        device:
          type: string
          const: cpu
      required:
      - utr_type
      - sequence
      - score
      - device
      additionalProperties: false
    description_en: Score an existing 5UTR sequence with the model; accepts DNA or RNA with optional N.
    availability:
